    <style>

        * {

        }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);

        nav ul {

            list-style: none;

        }

        nav a {
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 600;
            font-size: 0.95rem;
            transition: var(--transition);
        }

        nav a:hover { color: var(--primary); text-shadow: 0 0 10px var(--primary-glow); }

        .btn-glow {

            color: white;

            box-shadow: 0 4px 20px var(--primary-glow);

            cursor: pointer;

            width: 100%;

            margin-bottom: 30px;
        }

        .showreel-frame {
            position: relative;
            width: 100%;
            padding-bottom: 56.25%;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
        }

        .showreel-frame iframe {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%; border: none;
        }

            font-size: 0.95rem;
        }

        .comparison-container {

            overflow: hidden;
            border: 2px solid var(--border-ui);
            box-shadow: 0 20px 40px rgba(0,0,0,0.7);
        }

        .comparison-img {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-size: cover;
            background-position: center;
        }

        .before-img {
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1200&auto=format&fit=crop&q=80');

        }

        .after-img {
            background-image: url('https://images.unsplash.com/photo-1534447677768-be436bb09401?w=1200&auto=format&fit=crop&q=80');
            filter: contrast(115%) saturate(140%) brightness(1.05);
            width: 50%;
            border-right: 3px solid var(--primary);
        }

        .slider-handle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: var(--primary);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            box-shadow: 0 0 20px var(--primary-glow);
            pointer-events: none;
            z-index: 10;
        }

        .comparison-range {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            opacity: 0;
            cursor: ew-resize;
            z-index: 20;
        }

        .badge-before, .badge-after {
            position: absolute;
            bottom: 20px;
            padding: 6px 14px;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .badge-before { right: 20px; color: #aaa; }
        .badge-after { left: 20px; color: var(--primary); border: 1px solid var(--primary); }

            cursor: pointer;

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة تحكم صناع القرار | محاكِي إربد</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header>
        <a href="/" class="logo"><i class="fa-solid fa-city"></i> محاكِي <span>إربد</span></a>
        <nav><ul><li><a href="/">الرئيسية</a></li><li><a href="/multiplayer">التفاوض</a></li></ul></nav>
    </header>
    <section class="hero" style="min-height:60vh;">
        <h1>لوحة تحكم <span>صناع القرار</span></h1>
        <p style="color:var(--muted);">تقارير الميزانية، مؤشرات الاقتصاد الكلي، وملخصات الذكاء الاصطناعي في مكان واحد.</p>
    </section>
    <section class="section">
        <div style="background:var(--card); border:1px solid var(--border); border-radius:18px; padding:30px; max-width:900px; margin:auto;">
            <h3 style="margin-bottom:20px;">ملخص الموازنة العامة 2025</h3>
            <div class="macro-grid">
                <div class="macro-card"><h4 style="font-size:0.7rem; color:var(--muted);">الإيرادات الضريبية</h4><div class="macro-val" style="color:var(--cyan);">148M</div></div>
                <div class="macro-card"><h4 style="font-size:0.7rem; color:var(--muted);">عوائد الصكوك</h4><div class="macro-val" style="color:var(--gold);">24M</div></div>
                <div class="macro-card"><h4 style="font-size:0.7rem; color:var(--muted);">ريع الوقف</h4><div class="macro-val" style="color:var(--green);">1.1M</div></div>
                <div class="macro-card"><h4 style="font-size:0.7rem; color:var(--muted);">العجز/الفائض</h4><div class="macro-val" style="color:var(--green);">+12M</div></div>
            </div>
        </div>
    </section>
    <footer><p>&copy; 2025 محاكِي إربد الحضري</p></footer>
</body>
</html>
